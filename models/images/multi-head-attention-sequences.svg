    <text x="342" y="393">q<tspan baseline-shift="sub" font-size="9">1</tspan></text><text x="342" y="419">q<tspan baseline-shift="sub" font-size="9">2</tspan></text><text x="342" y="445">...</text><text x="342" y="471">q<tspan baseline-shift="sub" font-size="9">N</tspan></text>
    <text x="462" y="393">q<tspan baseline-shift="sub" font-size="9">1</tspan></text><text x="462" y="419">q<tspan baseline-shift="sub" font-size="9">2</tspan></text><text x="462" y="445">...</text><text x="462" y="471">q<tspan baseline-shift="sub" font-size="9">N</tspan></text>
    <text x="582" y="393">q<tspan baseline-shift="sub" font-size="9">1</tspan></text><text x="582" y="419">q<tspan baseline-shift="sub" font-size="9">2</tspan></text><text x="582" y="445">...</text><text x="582" y="471">q<tspan baseline-shift="sub" font-size="9">N</tspan></text>
