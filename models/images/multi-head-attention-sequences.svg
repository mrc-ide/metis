    <text x="462" y="263">k<tspan baseline-shift="sub" font-size="9">1</tspan></text><text x="462" y="289">k<tspan baseline-shift="sub" font-size="9">2</tspan></text><text x="462" y="315">...</text><text x="462" y="341">k<tspan baseline-shift="sub" font-size="9">N</tspan></text>
    <text x="582" y="263">k<tspan baseline-shift="sub" font-size="9">1</tspan></text><text x="582" y="289">k<tspan baseline-shift="sub" font-size="9">2</tspan></text><text x="582" y="315">...</text><text x="582" y="341">k<tspan baseline-shift="sub" font-size="9">N</tspan></text>
