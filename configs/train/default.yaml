defaults:
  - model: mlp_default
  - dataset: sirds
  - _self_

max_steps: 1000
eval_every: 100
peak_lr: 1e-3
lr_warmup_frac: 0.2
batch_size: 128
num_gpus: 1
precision: bf16
deterministic: false
seed: 42
plot_loss_curves: false
logger:
  use_wandb: false
  project: my-metis-project
  tags: []
sampling:
  generate_samples: false
  samples_name: null
  subsample: 50
  keep_greater_than_zero: false
  use_kv_cache: false #For transformer this means we use kv-cache for self-attention and cross-attn (once implemented). 
                      #For SiT, enables it for cross-attention, has no affect on MLP
checkpointer:
  save_every: never
  resume_from: null
hydra:
  searchpath:
    - file://configs
