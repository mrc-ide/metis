defaults:
  - model: flow_matching_default
  - dataset: truncated_magenta_2026_02_24
  - _self_

model:
  sit:
    n_blocks: 12
    n_head: 16
    n_kv_head: 8
    qkv_bias: true
    embd_dim: 256
    cond_dropout_prob: 0.0
    in_and_out_biases: true

max_steps: 10000
eval_every: 100
peak_lr: 0.0005130316975172501
lr_warmup_frac: 0.3
batch_size: 512
num_gpus: 1
precision: bf16
deterministic: false
seed: 42
plot_loss_curves: false
logger:
  use_wandb: false
  project: malaria_surrogates_imperial
  tags:
  - flow_matching
  - truncated_magenta_2026_02_24
sampling:
  generate_samples: true
  samples_name: truncated_magenta_2026_02_24_sota_final_relu_flow_matching.pdf
  keep_greater_than_zero: true
  subsample: 50

checkpointer:
  save_every: 10000
  resume_from: null

hydra:
  searchpath:
    - file://configs