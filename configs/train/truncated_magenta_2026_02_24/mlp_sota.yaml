defaults:
  - model: mlp_default
  - dataset: truncated_magenta_2026_02_24
  - _self_


model:
  num_blocks: 6
  hidden_dim: 512
  num_layers_per_block: 2

max_steps: 5000
eval_every: 100
peak_lr: 7.864374321495703e-06
lr_warmup_frac: 0
batch_size: 128
num_gpus: 1
precision: bf16
deterministic: false
seed: 42
plot_loss_curves: false
logger:
  use_wandb: false
  project: malaria_surrogates_imperial
  tags:
  - mlp
  - truncated_magenta_2026_02_24
sampling:
  generate_samples: true
  samples_name: truncated_magenta_2026_02_24_sota_mlp.pdf
  subsample: 50
  keep_greater_than_zero: false


checkpointer:
  save_every: 5000
  resume_from: null


hydra:
  searchpath:
    - file://configs
