defaults:
  - interpolant_transformer_schema
  - _self_

interpolant: flow-matching
num_steps: 50
solver: heun
multi_mode: median
sit:
    # Dataset-derived dimensions are assigned in train.py before model creation.
    n_blocks: 12
    n_head:  8  # number of query heads
    n_kv_head: 8  # number of key/value heads (GQA)
    qkv_bias:  True
    embd_dim:  64
    cond_dropout_prob: 0.0  # For classifier free guidance
    in_and_out_biases: true
    cross_attn: null
